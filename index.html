<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CLIPZY - Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.clip{height:100vh;width:100vw;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.clip video{width:100%;height:100%;object-fit:cover}
#top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;padding:12px;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)}
#counter{background:#8a2be2;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.right{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:20}
.r-btn{width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:#fff}
.r-btn span:first-child{width:48px;height:48px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
#postBtn{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:#fff;color:#000;border:none;padding:12px 20px;border-radius:30px;font-weight:800}
</style>
</head>
<body>
<div id="top"><div><b>CLIPZY</b> <small style="color:#0ff">Low Data</small></div><div id="counter">Free: 3/3</div></div>
<div id="feed"></div>
<button id="postBtn" onclick="handlePost()">📤 Saka Bidiyo</button>
<script>
const URL="https://gukuzlvwqaripnufvmlt.supabase.co";
const KEY="sb_publishable_x2ndSpPkpMsb3ajyBYBVrw_2y8K-84l";
const BUCKET="videos";
const supabaseClient=supabase.createClient(URL,KEY);
function getPostData(){const t=new Date().toDateString();let d=JSON.parse(localStorage.getItem('clipzy_final'));if(!d||d.date!==t){d={date:t,count:0};localStorage.setItem('clipzy_final',JSON.stringify(d))}return d;}
function updateCounter(){let d=getPostData();let r=3-d.count;document.getElementById('counter').innerText=r>0?`Free: ${r}/3`:`Free: 0/3`;}
async function handlePost(){
 let data=getPostData();
 if(data.count>=3){if(!confirm('Ka cika 3 kyauta. Ci gaba?'))return;}
 let input=document.createElement('input');input.type='file';input.accept='video/mp4,video/*';
 input.onchange=async e=>{
  let file=e.target.files[0];if(!file)return;
  if(!file.type.startsWith('video/')){alert('Don Allah zabi VIDEO (.mp4) ba audio (.m4a) ba');return;}
  let name=Date.now()+'_'+file.name.replace(/\s/g,'_');
  alert('Ana uploading: '+file.name);
  let {error}=await supabaseClient.storage.from(BUCKET).upload(name,file);
  if(error){alert('Error: '+error.message+' | Bucket: '+BUCKET);return;}
  data.count++;data.date=new Date().toDateString();localStorage.setItem('clipzy_final',JSON.stringify(data));updateCounter();alert('An saka!');loadFeed();
 };input.click();
}
async function loadFeed(){
 let feed=document.getElementById('feed');
 feed.innerHTML='';
 // 1. NUNA DEMO DA Farko Koda Yaushe - don kada ya zama black
 let demoDiv=document.createElement('div');demoDiv.className='clip';
 let demoVideo=document.createElement('video');demoVideo.src='https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';demoVideo.loop=true;demoVideo.autoplay=true;demoVideo.muted=true;demoVideo.playsInline=true;demoVideo.controls=false;
 demoVideo.addEventListener('click',()=>demoVideo.paused?demoVideo.play():demoVideo.pause());
 demoDiv.appendChild(demoVideo);
 let right=document.createElement('div');right.className='right';right.innerHTML=`<button class=r-btn><span>❤️</span><span>12k</span></button><button class=r-btn><span>💬</span><span>88</span></button><button class=r-btn><span>↗️</span><span>Share</span></button>`;
 demoDiv.appendChild(right);
 let over=document.createElement('div');over.style.cssText='position:absolute;bottom:20px;left:12px;right:60px';over.innerHTML='<b>@clipzy_demo</b><br><small>Wannan demo ne. Danna Saka Bidiyo ka saka naka! 👇</small>';demoDiv.appendChild(over);
 feed.appendChild(demoDiv);
 demoVideo.play().catch(()=>{});
 // 2. Sannan a loda na Supabase
 try{
  let {data,error}=await supabaseClient.storage.from(BUCKET).list();
  if(data && data.length>0){
   data.reverse().forEach(item=>{
    if(item.name==='.emptyFolderPlaceholder')return;
    let clip=document.createElement('div');clip.className='clip';
    let v=document.createElement('video');v.src=`${URL}/storage/v1/object/public/${BUCKET}/${item.name}`;v.loop=true;v.playsInline=true;v.addEventListener('click',()=>v.paused?v.play():v.pause());
    clip.appendChild(v);clip.appendChild(right.cloneNode(true));feed.appendChild(clip);
   });
  }
 }catch(e){console.log(e)}
}
updateCounter();loadFeed();
</script>
</body>
  </html>
